<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marqify</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/custom.css" />
</head>

<body>
    <div class="pm-marquee" data-speed="0.5" data-direction="left">
        <div class="pm-marquee__track">
            <div class="pm-marquee__item">Item 1</div>
            <div class="pm-marquee__item">Item 2</div>
        </div>
    </div>

    <br><br>

    <div class="pm-marquee2 pm-marquee" data-speed="0.5" data-direction="left">
        <div class="pm-marquee__track">
            <div class="pm-marquee__item">
                <img src="https://www.kelkoogroup.com/wp-content/uploads/2020/03/planche_logos_links.png" alt="Image 1"
                    height="44px" />
            </div>
            <div class="pm-marquee__item">
                <img src="https://images.squarespace-cdn.com/content/v1/659c161988609b421a2e5580/d5c78a4f-c63a-4cdf-b5bd-b72ca96892cb/Links_logo.png"
                    alt="Image 2" height="44px" />
            </div>
        </div>
    </div>


    <script src="js/main.js"></script>

    <script>

        const marquee = new PureMarquee(
            document.querySelector('.pm-marquee'),
            {
                speed: 0.8,
                direction: 'left'
            }
        );

        const marquee2 = new PureMarquee(
            document.querySelector('.pm-marquee2'),
            {
                speed: 14.5,
                customClasses: 'abc',
                direction: 'left',
                // vertical: true,
                pauseOnHover: false
            }
        );

    </script>

</body>

</html>
